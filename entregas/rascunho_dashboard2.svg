<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#2d223a">Rascunho — Dashboard 2: KPIs para olheiros e treinadores de MMA</text>

  <!-- Painel lateral (mesmo do dashboard 1) -->
  <rect x="20" y="50" width="200" height="570" fill="#f6efed" stroke="#999" stroke-dasharray="4"/>
  <text x="32" y="75" font-weight="bold">Painel lateral</text>
  <text x="32" y="95" font-size="11" fill="#666">(mesmos filtros do</text>
  <text x="32" y="110" font-size="11" fill="#666">Dashboard 1 — valem</text>
  <text x="32" y="125" font-size="11" fill="#666">para as duas abas)</text>

  <!-- Abas -->
  <rect x="240" y="50" width="200" height="28" fill="#fff" stroke="#999"/>
  <text x="252" y="69">🔬 Laboratório</text>
  <rect x="440" y="50" width="200" height="28" fill="#2d223a"/>
  <text x="452" y="69" fill="#fff">🎯 KPIs</text>

  <text x="240" y="100" font-size="12" fill="#666">Público-alvo: olheiros (scouts) e treinadores — "que perfil físico e de base vence mais?"</text>

  <!-- KPIs -->
  <g>
    <rect x="240" y="112" width="132" height="80" fill="#fff" stroke="#2d223a"/>
    <text x="250" y="132" font-size="11">Lutadores no recorte</text><text x="250" y="162" font-size="22" font-weight="bold">3.951</text><text x="250" y="182" font-size="10" fill="#666">% da base</text>
    <rect x="382" y="112" width="132" height="80" fill="#fff" stroke="#2d223a"/>
    <text x="392" y="132" font-size="11">Taxa média de vitória</text><text x="392" y="162" font-size="22" font-weight="bold">xx%</text><text x="392" y="182" font-size="10" fill="#2a8">▲ p.p. vs base</text>
    <rect x="524" y="112" width="132" height="80" fill="#fff" stroke="#2d223a"/>
    <text x="534" y="132" font-size="11">Cartel positivo</text><text x="534" y="162" font-size="22" font-weight="bold">xx%</text><text x="534" y="182" font-size="10" fill="#2a8">▲ p.p. vs base</text>
    <rect x="666" y="112" width="132" height="80" fill="#fff" stroke="#2d223a"/>
    <text x="676" y="132" font-size="11">Vantagem envergadura</text><text x="676" y="162" font-size="22" font-weight="bold">+x pol.</text><text x="676" y="182" font-size="10" fill="#666">ape index médio</text>
    <rect x="808" y="112" width="132" height="80" fill="#fff" stroke="#2d223a"/>
    <text x="818" y="132" font-size="11">Experiência mediana</text><text x="818" y="162" font-size="22" font-weight="bold">xx lutas</text><text x="818" y="182" font-size="10" fill="#666">vs base</text>
  </g>

  <text x="240" y="215" font-size="11">Tamanho mínimo de grupo (slider)</text>
  <line x1="440" y1="211" x2="640" y2="211" stroke="#2d223a" stroke-width="3"/><circle cx="480" cy="211" r="6" fill="#2d223a"/>

  <!-- Visual 1 -->
  <rect x="240" y="228" width="340" height="190" fill="#fff" stroke="#999"/>
  <text x="252" y="248" font-weight="bold">1. Taxa de vitória por categoria de peso</text>
  <g fill="#2d223a"><rect x="265" y="320" width="22" height="85"/><rect x="295" y="310" width="22" height="95"/><rect x="325" y="300" width="22" height="105"/><rect x="355" y="305" width="22" height="100"/><rect x="385" y="295" width="22" height="110"/><rect x="415" y="300" width="22" height="105"/><rect x="445" y="310" width="22" height="95"/><rect x="475" y="315" width="22" height="90"/><rect x="505" y="325" width="22" height="80"/></g>
  <line x1="255" y1="308" x2="570" y2="308" stroke="#d62728" stroke-dasharray="4"/>

  <!-- Visual 2 -->
  <rect x="600" y="228" width="340" height="190" fill="#fff" stroke="#999"/>
  <text x="612" y="248" font-weight="bold">2. % cartel positivo por base (Stance)</text>
  <g fill="#2d223a"><rect x="680" y="270" width="150" height="22"/><rect x="680" y="300" width="175" height="22"/><rect x="680" y="330" width="195" height="22"/><rect x="680" y="360" width="215" height="22"/></g>
  <text x="612" y="285" font-size="11">Desconh.</text><text x="612" y="315" font-size="11">Southpaw</text><text x="612" y="345" font-size="11">Orthodox</text><text x="612" y="375" font-size="11">Switch</text>

  <!-- Visual 3 -->
  <rect x="240" y="430" width="440" height="190" fill="#fff" stroke="#999"/>
  <text x="252" y="450" font-weight="bold">3. Boxplot: taxa de vitória por faixa de ape index</text>
  <g fill="#e9d4d0" stroke="#2d223a"><rect x="290" y="510" width="50" height="60"/><rect x="380" y="500" width="50" height="60"/><rect x="470" y="495" width="50" height="55"/><rect x="560" y="485" width="50" height="60"/></g>
  <rect x="700" y="430" width="240" height="190" fill="#fff" stroke="#999"/>
  <text x="712" y="450" font-weight="bold">Tabela de apoio</text>
  <text x="712" y="470" font-size="11" fill="#666">faixa · lutadores · taxa · % positivo</text>
</svg>
